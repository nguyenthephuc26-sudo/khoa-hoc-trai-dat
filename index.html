<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lớp học ảo Khoa học Trái Đất</title>
<meta name="description" content="Lớp học ảo môn Khoa học Trái Đất (GE1013): bài giảng diễn giải chi tiết 16 chương, hình minh hoạ từ slide, lộ trình 5 tuần và trợ lý hỏi đáp.">
<meta name="theme-color" content="#163d34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/icons/favicon-64.png">
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KHTĐ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#main">Bỏ qua menu</a>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Mở menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">
    <img src="img/icons/favicon-64.png" alt="" width="28" height="28">
    <span><b>Khoa học Trái Đất</b><small>Lớp học ảo · GE1013</small></span>
  </a>
  <div class="top-actions">
    <button class="icon-btn" id="searchBtn" aria-label="Tìm kiếm" title="Tìm kiếm">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối" title="Sáng / tối">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
    </button>
    <button class="btn-install" id="installBtn" hidden>Cài app</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Danh mục">
    <div class="nav-group">
      <a href="#/" data-nav="home">🏠 Trang chủ</a>
      <a href="#/lo-trinh" data-nav="lo-trinh">🗓️ Lộ trình 5 tuần</a>
      <a href="#/hoi-dap" data-nav="hoi-dap">💬 Trợ lý hỏi đáp</a>
      <a href="#/on-tap" data-nav="on-tap">📝 Ôn luyện &amp; đề thi</a>
      <a href="#/tong-on" data-nav="tong-on">🧭 Ôn tập tổng</a>
    </div>
    <div id="navChapters"></div>
    <div class="nav-foot">
      <div class="progress-mini"><span id="progText">0/17 chương</span><div class="bar"><i id="progBar"></i></div></div>
      <button class="link-btn" id="offlineBtn">⬇️ Tải hết hình để học offline</button>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main id="main" tabindex="-1">
    <div id="view" class="view"><div class="loading">Đang tải…</div></div>
  </main>
</div>

<button class="chat-fab" id="chatFab" aria-label="Mở trợ lý hỏi đáp">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 5h16v10H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="10" r="1.2" fill="currentColor"/><circle cx="12" cy="10" r="1.2" fill="currentColor"/><circle cx="15" cy="10" r="1.2" fill="currentColor"/></svg>
</button>
<section class="chat-panel" id="chatPanel" aria-label="Trợ lý hỏi đáp" hidden>
  <header><b>Trợ lý Khoa học Trái Đất</b><span class="sub">Trả lời từ ngân hàng câu hỏi soạn theo slide</span>
    <a class="chat-full" href="#/hoi-dap" title="Mở toàn màn hình">⤢</a>
    <button class="icon-btn" id="chatClose" aria-label="Đóng">✕</button></header>
  <div class="chat-body" data-chat="panel"></div>
</section>

<div class="lightbox" id="lightbox" hidden>
  <button class="icon-btn lb-close" aria-label="Đóng hình">✕</button>
  <img alt="">
  <p class="lb-cap"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/app.js"></script>
</body>
</html>
